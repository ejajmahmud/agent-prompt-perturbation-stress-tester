[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-prompt-perturbation-stress-tester"
version = "0.1.0"
description = "Autonomous adversarial perturbation suite testing system prompts against typo attacks, token dropping, and delimiter confusion"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-prompt-perturbation-stress-tester = "agent_prompt_perturbation_stress_tester.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_prompt_perturbation_stress_tester*"]
